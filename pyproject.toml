[project]
name = "itcs525-lab12-starter"
version = "0.1.0"
description = "Calculator API and PostgreSQL starting point for the ORM lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asteval>=1.0.6,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlmodel>=0.0.22,<0.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
